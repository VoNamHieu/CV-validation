name: CI

# The apply agent's safety rules are enforced by code, and code that is not run
# on every push is a rule that decays quietly. A green Vercel deploy proves the
# Next app builds — it says nothing about whether the extension still refuses to
# submit an application, or whether the credential encryption still round-trips.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  extension:
    name: Extension — tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No lockfile-dependent install: the only devDependency is esbuild.
      - run: npm install --no-audit --no-fund
      # The safety suite. A failure here means the agent can take an action the
      # user never approved — treat it as a release blocker, not a flaky test.
      - run: npm test
      # esbuild does not error on an undeclared identifier, so building is not
      # proof on its own — but a broken import (a renamed export, a missing
      # module) does fail here, which has already caught one shipped bug.
      - run: npm run build

  backend:
    name: Backend — ATS account tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      # Scoped to the suites that hold third-party credentials and the tenant
      # state machine — the places where being wrong locks a user out of a real
      # candidate account.
      - run: pytest tests/test_ats_crypto.py tests/test_ats_accounts_repo.py tests/test_ats_accounts_routes.py -q

  frontend:
    name: Frontend — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
